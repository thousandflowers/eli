name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -c "import json; json.load(open('$f')); print('ok:', '$f')"
          done

      - name: Versions in sync
        run: |
          a=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          b=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          echo "plugin=$a marketplace=$b"
          test "$a" = "$b"

      - name: Shellcheck hooks (errors only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error hooks/*.sh

      - name: Dispatcher present
        run: test -f commands/eli.md
